name: Blinds Python

on:
  push:
    paths:
      - .github/workflows/blinds-python.yml
      - blinds/**
  pull_request:
    paths:
      - .github/workflows/blinds-python.yml
      - blinds/**

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync blinds project
        run: uv sync --project blinds --group dev --locked

      - name: Ruff
        run: uv run --project blinds ruff check blinds

      - name: Mypy
        run: uv run --project blinds mypy --config-file blinds/pyproject.toml blinds

      - name: Build package
        run: uv build --project blinds